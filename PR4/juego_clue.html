<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misterio en Mansión Wayne</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Urbanist:wght@400;700&display=swap');

:root {
    --bg-color: #0f172a;
    --panel-bg: #1e293b;
    --accent: #facc15;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
}

body {
    font-family: 'Urbanist', sans-serif;
    background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

#game-container {
    width: 100%;
    max-width: 900px;
    background-color: var(--panel-bg);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #334155;
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}

header {
    background-color: #020617;
    padding: 20px;
    text-align: center;
    border-bottom: 4px solid var(--accent);
}

h1 {
    font-family: 'Bangers';
    color: var(--accent);
    font-size: 40px;
    margin: 0;
    letter-spacing: 2px;
}

#screen {
    padding: 30px;
    text-align: center;
    min-height: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.avatar {
    width: 130px;
    height: 130px;
    object-fit: contain;
    margin-bottom: 15px;
    border-radius: 50%;
    background: #020617;
    border: 3px solid var(--accent);
}

.dialogue-box {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    border-left: 5px solid var(--accent);
    font-size: 18px;
    max-width: 600px;
    line-height: 1.5;
}

#controls {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    padding: 20px 30px;
    background: #0f172a;
    border-top: 1px solid #334155;
}

button {
    padding: 15px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    background: var(--panel-bg);
    color: white;
    font-family: 'Bangers', cursive;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
    text-transform: uppercase;
}

button:hover {
    background: var(--accent);
    color: #000;
}

.action-panel {
    display: none;
    margin-top: 20px;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.action-panel button {
    font-family: 'Urbanist', sans-serif;
    font-size: 16px;
    padding: 10px 15px;
}

#acusacion-form {
    display: none;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 400px;
}

select {
    padding: 10px;
    background: #0f172a;
    color: white;
    border: 2px solid var(--accent);
    border-radius: 5px;
    font-size: 16px;
}
</style>
</head>

<body>

<div id="game-container">
    <header>
        <h1>CLUE: MANSIÓN WAYNE</h1>
    </header>

    <div id="screen">
        <img id="avatar-img" class="avatar" src="img/default.png" alt="Icono">

        <div class="dialogue-box" id="main-text">
            Ha ocurrido un crimen en la mansión. El jarrón de diamantes ha sido destruido. Eres el detective encargado de interrogar a los felinos, inspeccionar las habitaciones y encontrar al culpable.
        </div>

        <div id="panel-inspeccionar" class="action-panel"></div>
        <div id="panel-interrogar" class="action-panel"></div>

        <div id="acusacion-form">
            <select id="sel-culpable"></select>
            <select id="sel-arma"></select>
            <select id="sel-lugar"></select>
            <button onclick="verificarAcusacion()" style="background:#ef4444; border-color:#ef4444;">¡Acusar Ahora!</button>
            <button onclick="volverAlInicio()" style="border-color:#94a3b8; color:#94a3b8;">Cancelar</button>
        </div>
    </div>

    <div id="controls">
        <button onclick="mostrarPanel('inspeccionar')">🔍 Inspeccionar</button>
        <button onclick="mostrarPanel('interrogar')">💬 Interrogar</button>
        <button onclick="mostrarPanel('acusar')">⚖️ Acusar</button>
    </div>
</div>

<script>
// 1. PERSONAJES E INVENTARIO
const personajes = [
    { id: "Bruno", icono: "img/bruno.png", desc: "El Vigilante" },
    { id: "Alfredo", icono: "img/alfredo.png", desc: "El Mayordomo Tuxedo" },
    { id: "Damian", icono: "img/damian.png", desc: "El Rebelde" },
    { id: "Espejo", icono: "img/espejo.png", desc: "El Caricaturesco" },
    { id: "Selina", icono: "img/selina.png", desc: "La Escurridiza" }
];

const locaciones = ["Sala", "Cocina", "Comedor", "Dormitorio", "Cuarto Prohibido"];
const armas = ["Candelabro", "Daga", "Tubo de Plomo", "Revólver", "Cuerda"];

let crimenReal = {};
let distribucionArmas = {};
let timerId = null;

const avatar = document.getElementById("avatar-img");
const screenText = document.getElementById("main-text");

// 2. INICIO Y ASIGNACIÓN ALEATORIA
function iniciarJuego() {
    crimenReal = {
        culpable: personajes[Math.floor(Math.random() * personajes.length)].id,
        lugar: locaciones[Math.floor(Math.random() * locaciones.length)],
        arma: armas[Math.floor(Math.random() * armas.length)]
    };

    distribucionArmas = {}; // Limpiamos la distribución anterior
    let armasMezcladas = [...armas].sort(() => 0.5 - Math.random());
    locaciones.forEach((loc, i) => {
        distribucionArmas[loc] = armasMezcladas[i];
    });

    console.log("NUEVO CRIMEN REAL:", crimenReal);

    generarSelects();
    generarBotones();
}

// 3. REINICIAR JUEGO (NUEVA FUNCIÓN)
function reiniciarJuego() {
    iniciarJuego(); // Genera nuevo crimen y reconstruye botones/selects
    
    // Restaurar la interfaz al estado original
    ocultarTodo();
    document.getElementById("controls").style.display = "grid";
    avatar.src = "img/default.png";
    screenText.innerHTML = "Un nuevo crimen ha ocurrido en la mansión. ¿Podrás resolverlo esta vez, detective?";
}

// 4. CONTROL DE PANELES
function mostrarPanel(tipo) {
    clearTimeout(timerId); 
    ocultarTodo();
    document.getElementById("controls").style.display = "none";

    if (tipo === "inspeccionar") {
        avatar.src = "img/puerta.png";
        screenText.innerHTML = "¿Qué habitación deseas investigar?";
        document.getElementById("panel-inspeccionar").style.display = "flex";
    }

    if (tipo === "interrogar") {
        avatar.src = "img/interrogar.png";
        screenText.innerHTML = "¿A qué gato sospechoso vas a presionar?";
        document.getElementById("panel-interrogar").style.display = "flex";
    }

    if (tipo === "acusar") {
        avatar.src = "img/acusar.png";
        screenText.innerHTML = "Arma tu deducción. Si fallas, el culpable escapará.";
        document.getElementById("acusacion-form").style.display = "flex";
    }
}

function ocultarTodo() {
    document.getElementById("panel-inspeccionar").style.display = "none";
    document.getElementById("panel-interrogar").style.display = "none";
    document.getElementById("acusacion-form").style.display = "none";
}

function volverAlInicio() {
    clearTimeout(timerId);
    ocultarTodo();
    document.getElementById("controls").style.display = "grid";
    avatar.src = "img/default.png";
    screenText.innerHTML = "Continúa con tu investigación, detective.";
}

// 5. MECÁNICA DE INSPECCIÓN
function inspeccionar(lugar) {
    clearTimeout(timerId);
    avatar.src = "img/investigar.png";
    let armaEncontrada = distribucionArmas[lugar];

    let mensaje = `Al revisar cuidadosamente <b>${lugar}</b>, encuentras <b>${armaEncontrada}</b> oculta.`;

    if (lugar === crimenReal.lugar) {
        mensaje += `<br><br><span style="color:#facc15;">¡PISTA VITAL! Hay marcas de garras y un olor extraño. Esta es la escena del crimen.</span>`;
    }

    screenText.innerHTML = mensaje;
    timerId = setTimeout(volverAlInicio, 4500);
}

// 6. MECÁNICA DE INTERROGATORIO Y DIÁLOGOS
function interrogar(idGato) {
    clearTimeout(timerId);
    const gato = personajes.find(p => p.id === idGato);
    avatar.src = gato.icono;

    if (idGato === crimenReal.culpable) {
        let dialogoMiente = "";
        if(idGato === "Bruno") dialogoMiente = "La oscuridad oculta muchos secretos... y yo no tengo por qué contártelos.";
        if(idGato === "Alfredo") dialogoMiente = "(Se arregla la pajarita) Yo... estuve limpiando mi arena todo el tiempo. No sé nada.";
        if(idGato === "Damian") dialogoMiente = "¡Tú no puedes probar nada! ¡Nadie me vio en la escena!";
        if(idGato === "Espejo") dialogoMiente = "A veces el reflejo que ves... es el de un cazador. Miau.";
        if(idGato === "Selina") dialogoMiente = "(Ronronea con malicia) Un buen ladrón nunca deja sus herramientas en la escena... ni sus huellas.";

        screenText.innerHTML = `<b>${gato.id}:</b> "${dialogoMiente}"`;
    } else {
        const cuartoPista = locaciones[Math.floor(Math.random() * locaciones.length)];
        const armaPista = distribucionArmas[cuartoPista];
        
        let dialogoVerdad = "";
        if(idGato === "Bruno") dialogoVerdad = `Yo vigilo desde las sombras. Vi claramente que ${armaPista} estaba en ${cuartoPista}.`;
        if(idGato === "Alfredo") dialogoVerdad = `Mantengo todo en orden. Le aseguro que dejé ${armaPista} en ${cuartoPista}.`;
        if(idGato === "Damian") dialogoVerdad = `¡Déjame en paz! Solo sé que no me acerqué a ${cuartoPista}, olía a ${armaPista}.`;
        if(idGato === "Espejo") dialogoVerdad = `Los reflejos no mienten. Alguien movió ${armaPista} hacia ${cuartoPista}.`;
        if(idGato === "Selina") dialogoVerdad = `Me gustan las cosas brillantes. Iba a robar ${armaPista} que estaba en ${cuartoPista}, pero alguien me ganó.`;

        screenText.innerHTML = `<b>${gato.id}:</b> "${dialogoVerdad}"`;
    }

    timerId = setTimeout(volverAlInicio, 5500);
}

// 7. VALIDACIÓN Y FINALES DE HISTORIA
function verificarAcusacion() {
    clearTimeout(timerId);
    const cul = document.getElementById("sel-culpable").value;
    const arm = document.getElementById("sel-arma").value;
    const lug = document.getElementById("sel-lugar").value;

    if(!cul || !arm || !lug) {
        screenText.innerHTML = "¡Debes seleccionar a un sospechoso, un arma y un lugar válido!";
        return; 
    }

    ocultarTodo();

    let botonReinicio = `<br><br><button onclick="reiniciarJuego()" style="background:var(--accent); color:#000; border:none; padding:10px 20px; font-size:18px;">🔄 Volver a Jugar</button>`;

    if (cul === crimenReal.culpable && arm === crimenReal.arma && lug === crimenReal.lugar) {
        avatar.src = "img/ganar.png";
        
        let historiaFinal = "";
        if(cul === "Bruno") historiaFinal = `Caso Venganza de Murciélago. El Sr. Bruno actuó para proteger un oscuro secreto familiar. Cometió el acto en ${lug} con ${arm}.`;
        if(cul === "Alfredo") historiaFinal = `Caso Crimen de Mayordomo. Harto de un chantaje que ponía en riesgo su reputación, actuó con frialdad en ${lug} utilizando ${arm}.`;
        if(cul === "Damian") historiaFinal = `Caso Rebeldía Joven. En un acto de furia incontrolada, el joven Damian emboscó a su víctima en ${lug} usando ${arm}.`;
        if(cul === "Espejo") historiaFinal = `Caso Reflejo Oscuro. En un delirio de doble identidad, cometió el acto en ${lug} empuñando ${arm}.`;
        if(cul === "Selina") historiaFinal = `Caso Robo Pasional. Atrapada en pleno robo, no tuvo opción. Cometió el acto en ${lug} con ${arm} y huyó sin dejar rastro.`;

        screenText.innerHTML = `<h2 style="color:var(--success); margin-bottom:10px;">¡CASO CERRADO!</h2>${historiaFinal} ${botonReinicio}`;
    } else {
        avatar.src = "img/perder.png";
        screenText.innerHTML = `<h2 style="color:var(--danger); margin-bottom:10px;">VEREDICTO INCORRECTO</h2>El asesino sigue suelto y escapó en la noche. La verdad era que <b>${crimenReal.culpable}</b> cometió el acto en <b>${crimenReal.lugar}</b> con <b>${crimenReal.arma}</b>. ${botonReinicio}`;
    }
}

// 8. GENERADORES DE INTERFAZ
function generarSelects() {
    const sCul = document.getElementById("sel-culpable");
    const sArm = document.getElementById("sel-arma");
    const sLug = document.getElementById("sel-lugar");

    sCul.innerHTML = '<option value="">-- Selecciona Culpable --</option>';
    sArm.innerHTML = '<option value="">-- Selecciona Arma --</option>';
    sLug.innerHTML = '<option value="">-- Selecciona Lugar --</option>';

    personajes.forEach(p => sCul.innerHTML += `<option value="${p.id}">${p.id}</option>`);
    armas.forEach(a => sArm.innerHTML += `<option value="${a}">${a}</option>`);
    locaciones.forEach(l => sLug.innerHTML += `<option value="${l}">${l}</option>`);
}

function generarBotones() {
    const p1 = document.getElementById("panel-inspeccionar");
    p1.innerHTML = ""; // Limpiamos para evitar botones duplicados al reiniciar
    locaciones.forEach(l => {
        let b = document.createElement("button");
        b.innerText = l;
        b.onclick = () => inspeccionar(l);
        p1.appendChild(b);
    });

    const p2 = document.getElementById("panel-interrogar");
    p2.innerHTML = ""; // Limpiamos para evitar botones duplicados al reiniciar
    personajes.forEach(p => {
        let b = document.createElement("button");
        b.innerText = p.id;
        b.onclick = () => interrogar(p.id);
        p2.appendChild(b);
    });
}

// Iniciar
iniciarJuego();
</script>

</body>
</html>
