<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misterio en Mansión Wayne</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Urbanist:wght@400;700&display=swap');

:root {
    --bg-color: #0f172a;
    --panel-bg: #1e293b;
    --accent: #facc15;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
}

body {
    font-family: 'Urbanist', sans-serif;
    background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#game-container {
    max-width: 900px;
    background-color: var(--panel-bg);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #334155;
}

header {
    background-color: #020617;
    padding: 20px;
    text-align: center;
    border-bottom: 4px solid var(--accent);
}

h1 {
    font-family: 'Bangers';
    color: var(--accent);
}

#screen {
    padding: 30px;
    text-align: center;
}

.avatar {
    width: 120px;
    height: 120px;
    object-fit: contain;
    margin-bottom: 15px;
}

.dialogue-box {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    border-left: 5px solid var(--accent);
}

#controls {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    padding: 20px;
}

button {
    padding: 12px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    background: var(--panel-bg);
    color: white;
    cursor: pointer;
}

.action-panel {
    display: none;
    margin-top: 20px;
}

#acusacion-form {
    display: none;
    flex-direction: column;
    gap: 10px;
}
</style>
</head>

<body>

<div id="game-container">

<header>
<h1>CLUE: MANSIÓN WAYNE</h1>
</header>

<div id="screen">

<img id="avatar-img" class="avatar" src="img/default.png">

<div class="dialogue-box" id="main-text">
Ha ocurrido un crimen en la mansión. El jarrón de diamantes ha sido destruido. Eres el detective encargado de interrogar a los felinos, inspeccionar las habitaciones y encontrar al culpable.
</div>

<div id="panel-inspeccionar" class="action-panel"></div>
<div id="panel-interrogar" class="action-panel"></div>

<div id="acusacion-form">
<select id="sel-culpable"></select>
<select id="sel-arma"></select>
<select id="sel-lugar"></select>
<button onclick="verificarAcusacion()">¡Acusar!</button>
<button onclick="volverAlInicio()">Cancelar</button>
</div>

</div>

<div id="controls">
<button onclick="mostrarPanel('inspeccionar')">🔍 Inspeccionar</button>
<button onclick="mostrarPanel('interrogar')">💬 Interrogar</button>
<button onclick="mostrarPanel('acusar')">⚖️ Acusar</button>
</div>

</div>

<script>

// PERSONAJES (solo cambiamos icono por imagen)
const personajes = [
    { id: "Bruno", icono: "img/bruno.png", desc: "El Vigilante" },
    { id: "Alfredo", icono: "img/alfredo.png", desc: "El Mayordomo Tuxedo" },
    { id: "Damian", icono: "img/damian.png", desc: "El Rebelde" },
    { id: "Espejo", icono: "img/espejo.png", desc: "El Caricaturesco" },
    { id: "Selina", icono: "img/selina.png", desc: "La Escurridiza" }
];

const locaciones = ["Sala","Cocina","Comedor","Dormitorio","Cuarto Prohibido"];
const armas = ["Candelabro","Daga","Tubo de Plomo","Revólver","Cuerda"];

let crimenReal = {};
let distribucionArmas = {};

const avatar = document.getElementById("avatar-img");
const screenText = document.getElementById("main-text");

// INICIO
function iniciarJuego(){
    crimenReal = {
        culpable: personajes[Math.floor(Math.random()*personajes.length)].id,
        lugar: locaciones[Math.floor(Math.random()*locaciones.length)],
        arma: armas[Math.floor(Math.random()*armas.length)]
    };

    let armasMezcladas = [...armas].sort(()=>0.5-Math.random());
    locaciones.forEach((loc,i)=>{
        distribucionArmas[loc]=armasMezcladas[i];
    });

    generarSelects();
    generarBotones();
}

// PANELES
function mostrarPanel(tipo){
    ocultarTodo();
    document.getElementById("controls").style.display="none";

    if(tipo==="inspeccionar"){
        avatar.src="img/puerta.png";
        screenText.innerHTML="¿Qué habitación deseas investigar?";
        document.getElementById("panel-inspeccionar").style.display="block";
    }

    if(tipo==="interrogar"){
        avatar.src="img/interrogar.png";
        screenText.innerHTML="¿A qué gato sospechoso vas a presionar?";
        document.getElementById("panel-interrogar").style.display="block";
    }

    if(tipo==="acusar"){
        avatar.src="img/acusar.png";
        screenText.innerHTML="Arma tu deducción. Si fallas, el culpable escapará.";
        document.getElementById("acusacion-form").style.display="flex";
    }
}

function ocultarTodo(){
    document.getElementById("panel-inspeccionar").style.display="none";
    document.getElementById("panel-interrogar").style.display="none";
    document.getElementById("acusacion-form").style.display="none";
}

function volverAlInicio(){
    ocultarTodo();
    document.getElementById("controls").style.display="grid";
    avatar.src="img/default.png";
    screenText.innerHTML="Continúa con tu investigación, detective.";
}

// INSPECCION
function inspeccionar(lugar){
    avatar.src="img/investigar.png";
    let armaEncontrada = distribucionArmas[lugar];

    let mensaje = `Al revisar cuidadosamente ${lugar}, encuentras <b>${armaEncontrada}</b> oculta.`;

    if(lugar===crimenReal.lugar){
        mensaje += `<br><br><span style="color:#facc15;">¡PISTA VITAL! Esta es la escena del crimen.</span>`;
    }

    screenText.innerHTML=mensaje;
    setTimeout(volverAlInicio,4000);
}

// INTERROGAR (DIÁLOGOS ORIGINALES)
function interrogar(idGato){
    const gato = personajes.find(p=>p.id===idGato);
    avatar.src = gato.icono;

    if(idGato===crimenReal.culpable){
        const mentiras=[
            "¡Yo estaba afilando mis uñas! No sé nada de ninguna escena del crimen.",
            "*Se lame la pata nervioso* El servicio es difícil...",
            "¡No puedes probar que yo estuve ahí!",
            "La noche oculta mis secretos..."
        ];
        screenText.innerHTML=`<b>${gato.id}:</b> "${mentiras[Math.floor(Math.random()*mentiras.length)]}"`;
    }else{
        const cuartoPista = locaciones[Math.floor(Math.random()*locaciones.length)];
        const armaPista = distribucionArmas[cuartoPista];
        screenText.innerHTML=`<b>${gato.id}:</b> "Yo no fui... vi ${armaPista} en ${cuartoPista}"`;
    }

    setTimeout(volverAlInicio,5000);
}

// VERIFICAR
function verificarAcusacion(){
    const cul=document.getElementById("sel-culpable").value;
    const arm=document.getElementById("sel-arma").value;
    const lug=document.getElementById("sel-lugar").value;

    if(cul===crimenReal.culpable && arm===crimenReal.arma && lug===crimenReal.lugar){
        avatar.src="img/ganar.png";
        screenText.innerHTML="¡CASO CERRADO!";
    }else{
        avatar.src="img/perder.png";
        screenText.innerHTML=`Fallaste. Era ${crimenReal.culpable}`;
    }
}

// SELECTS (ARREGLADO)
function generarSelects(){
    const sCul=document.getElementById("sel-culpable");
    const sArm=document.getElementById("sel-arma");
    const sLug=document.getElementById("sel-lugar");

    personajes.forEach(p=> sCul.innerHTML+=`<option>${p.id}</option>`);
    armas.forEach(a=> sArm.innerHTML+=`<option>${a}</option>`);
    locaciones.forEach(l=> sLug.innerHTML+=`<option>${l}</option>`);
}

// BOTONES
function generarBotones(){
    const p1=document.getElementById("panel-inspeccionar");
    locaciones.forEach(l=>{
        let b=document.createElement("button");
        b.innerText=l;
        b.onclick=()=>inspeccionar(l);
        p1.appendChild(b);
    });

    const p2=document.getElementById("panel-interrogar");
    personajes.forEach(p=>{
        let b=document.createElement("button");
        b.innerText=p.id;
        b.onclick=()=>interrogar(p.id);
        p2.appendChild(b);
    });
}

iniciarJuego();

</script>

</body>
</html>
